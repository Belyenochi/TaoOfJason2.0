# Rebuilt from the generated site, not recovered: the original _config.yml was
# lost with the source tree. Every value here was read off the deployed HTML
# (site chrome, permalinks, generator meta), so what is NOT visible in HTML --
# plugin options, deploy credentials -- is a guess marked as such.
title: The Tao of Jason
subtitle: ''
description: ''
author: Jason
language: zh-Hans
timezone: Asia/Shanghai

url: https://belyenochi.github.io
root: /
# The deployed URLs are /YYYY/MM/DD/slug/ -- this permalink reproduces them.
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date
per_page: 10
pagination_dir: page

theme: next

# GUESS: the site was deployed to the github.io repo's master branch (that is
# where the generated files are). Fill in before running `hexo deploy`.
deploy:
  type: git
  repo: git@github.com:Belyenochi/belyenochi.github.io.git
  branch: master

# The generated pages include a local search index (search.xml), so this
# plugin was installed.
search:
  path: search.xml
  field: post
